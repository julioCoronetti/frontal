[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frontal"
version = "0.1.0"
description = "Decoupled high-performance TUI frontend harness for Antigravity CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "textual>=8.0.0",
]

[project.scripts]
frontal = "agy_tui.cli:main"
agy-tui = "agy_tui.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM"]
ignore = ["E501", "SIM105"]
